[pytest]
# pytest 配置

# 测试发现规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 输出配置
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    integration: 集成测试（需要外部依赖）
    slow: 慢速测试
    unit: 单元测试

# 覆盖率配置（需要安装 pytest-cov）
# addopts = -v --cov=src --cov-report=html --cov-report=term

[coverage:run]
source = src
omit =
    tests/*
    venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
