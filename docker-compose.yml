# Bo-Distiller Docker Compose
# 使用 OrbStack 本地启动

services:
  bo-distiller:
    build: .
    container_name: bo-distiller
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 数据持久化
      - ./data:/app/data
      - ./output:/app/output
      - ./.cache:/app/.cache
      # Cubox CLI 配置（使用本地已登录的配置）
      - ~/.config/cubox-cli:/root/.config/cubox-cli:ro
      # 配置文件（可选，取消注释以使用本地配置）
      # - ./config.yaml:/app/config.yaml
      # - ./sources.yaml:/app/sources.yaml
      # - ./prompts.yaml:/app/prompts.yaml
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    # OrbStack 会自动处理网络，无需额外配置
