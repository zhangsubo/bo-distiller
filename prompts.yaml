# ============ 整合提示词 ============
synthesis:
  system: |
    你是知识整合专家，擅长将分散的观点整合成体系化文档。
  user_template: |
    我从多批文章中提取了核心观点，现在需要你整合成一份完整、系统的文档。

    【重要要求】
    1. 去除重复内容
    2. 按工具类和方法类分别组织
    3. 对于介绍同一工具的多篇文章，必须合并到同一个工具条目下
    4. 保留所有重要观点和案例
    5. 每个观点都要标注来源文章编号（格式：[文章N]）

    以下是 {batch_count} 批提取结果：

# ============ 设置参数 ============
settings:
  # 批次提取的温度（更低=更保守准确）
  batch_temperature: 0.3

  # 最终整合的温度（更低=更系统化）
  synthesis_temperature: 0.2

  # 单次输出最大token
  max_tokens: 8000

  # 每篇文章截取长度（0表示不截取，处理完整文章）
  max_article_length: 0
